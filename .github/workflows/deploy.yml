name: Deploy Backend

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Build JAR
      run: mvn clean install

    - name: Deploy to Server
      run: |
        cp target/assignment-0.0.1-SNAPSHOT.jar /opt/backend-app/assignment-0.0.1-SNAPSHOT.jar
        sudo systemctl restart backend
